name: CI

# Runs on every branch push so a session gets early signal, and again on the PR
# into main. The PR run is the gate: branch protection requires its `check`, and
# it is the only run a pull request from a fork gets, since a fork's pushes
# happen in the fork.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to a branch with an open PR would otherwise queue two identical runs.
# Cancelling superseded runs keeps the signal fast and the minutes cheap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the major version used locally (v24). `cache: npm` keys
          # off package-lock.json, so installs stay fast between runs.
          node-version: '24'
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a run can
      # never silently pick up a newer transitive dependency than you tested with.
      # `--no-audit`: npm's audit took a minute of every run here; it runs
      # weekly in audit.yml instead, failing on what reaches users.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # A comment marked TEMPORARY is a merge blocker by this repo's convention.
      # The shape lab once reached main that way, because nothing checked; now
      # a leftover TEMPORARY fails the build instead of relying on memory.
      - name: No TEMPORARY markers
        run: |
          if grep -rn "TEMPORARY" src; then
            echo "::error::Resolve the TEMPORARY markers above before merging."
            exit 1
          fi

      - name: Tests
        run: npm run test:run

      # `build` is `tsc && vite build`, so this is also the type check. It
      # catches what tests miss: a bad import path, a missing asset, a plugin
      # misconfiguration.
      - name: Build
        run: npm run build
